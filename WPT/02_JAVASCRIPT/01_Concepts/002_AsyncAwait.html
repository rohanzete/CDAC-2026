        // method 2 :


        async function getUser()
        {
            return new Promise((resolve, reject)=>{

                const user = {

                name : "rohan",
                id : 101,
                dept : "computer"

                }

                resolve(user);
            })
        }

        
        async function showData()
        {
            const data = await getUser();
            console.log(data);
            console.log(data.name);
            console.log(data.id);
            console.log(data.dept);
        }

        showData();


    </script>
