<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping</title>
    <link rel="stylesheet" href="css/common.css">
</head>
<body>

     <div id="container" class="container" >
        <img src="images/logo.jpg" class="logo" alt="Shopping mall"/>
        <hr/>
        <a href="Shopping.html">Go shopping</a> |&nbsp;&nbsp;
        <a href="Billing.html">Go billing</a>|&nbsp;&nbsp;
        <a href="About.html">About</a>|&nbsp;&nbsp;
        <hr/>


        <div id="adDiv" class="adcontainer" >
            <img src="#" class="adimg" alt="Advertise">
        </div>

        <hr/>
          <div id="pagecontent" class="pagecontent">    
          </div>
        <hr/>
        <center>
            <h3 >Developed By Harshit</h4>
            &nbsp;
            <a href="linkedin.com">
                <img src="images/linkedin.png" alt="Linkedin pg link" class="SocialMediaIcon">
            </a>
            &nbsp;
            <a href="facebook.com">
                <img src="images/fb.png" alt="facebook pg link" class="SocialMediaIcon">
            </a>
            &nbsp;
            <a href="Instagram.com">
                <img src="images/insta.png" alt="Instagram pg link" class="SocialMediaIcon">
            </a>
            &nbsp;
        </center>
        <hr/>
     </div>

     <script>

        var helper=new XMLHttpRequest();

        function GetProducts(){
            helper.onreadystatechange=UponReadyStateChange;
            helper.open("GET","https://dummyjson.com/products");
            helper.send();

        }

        function UponReadyStateChange(){
             if(helper.readyState==4 && helper.status==200){
                 var responsefromServer=JSON.parse(helper.responseText);
                 var products=responsefromServer.products;

                 var reftopagecontent=document.getElementById("pagecontent");

                 for(i=0;i<products.length;i++){
                    var product=products[i];
                    // Producttemplate file code from div inserted below
                    var productUI=`<div style="width: 98%;border: 2px black solid;">
        <table  border="1px" style="width: 98%; margin: 5px;">
            <tbody>
                <tr>
                    <td style="width: 100px;"><img src="${product.thumbnail}" 
                        alt="${product.title}">
                    </td>                
                    <td>
                        <table border="1" style="width: 50%;">
                            <tr>
                                <td  style="font-weight: bolder; width: 150px;" >ProductId:</td>
                                <td>${product.id}</td>
                            </tr>
                            <tr>
                                <td style="font-weight: bolder; width: 150px;">Product:</td>
                                <td>${product.title}</td>
                            </tr>
                            <tr>
                                <td style="font-weight: bolder; width: 150px;">Description:</td>
                                <td>
                                    <p> ${product.description}</p>

                                </td>
                            </tr>
                            <tr>
                                <td style="font-weight: bolder; width: 150px;">Price:</td>
                                <td>${product.price}</td>
                            </tr>
                            <tr>
                               <td style="font-weight: bolder; width: 150px;">Rating:</td>
                                <td>${product.rating}</td> 
                            </tr>
                        </table>
                    </td>
                    <td style="padding: 10px;">
                        <input type="button" 
                        id="btnadd" 
                        value="Add to cart"
                        onclick="AddtoCart(${product.id},'${product.title}',${product.price})">
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    <hr/>`;

                   reftopagecontent.innerHTML= reftopagecontent.innerHTML+productUI;
                 }
             }
        }
        var ProductPurchased=[];

        function AddtoCart(ProductId,productName,Price){
            console.log(
                `Product Id=${ProductId},Product Name=${productName},Product Price=${Price}`,
                ProductPurchased.push({
                    ID:ProductId,
                    Title:productName,
                    Price:Price
                }),
            );
        }
        GetProducts();

     </script>
</body>
</html
